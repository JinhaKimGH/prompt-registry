[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-registry"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
]

[project.scripts]
prompt = "prompt_registry.cli:app"

[tool.setuptools.packages.find]
where = ["."]
